name: Verify and deploy to dev
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA to revalidate and redeploy in dev
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: Dev checks
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-web.yml@43018f3d7ec3605d14379be6f1f5de287ad6a1f1
    with:
      automation_sha: '43018f3d7ec3605d14379be6f1f5de287ad6a1f1'
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: '24'
  deploy_dev:
    name: Dev delivery
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-web.yml@43018f3d7ec3605d14379be6f1f5de287ad6a1f1
    with:
      automation_sha: '43018f3d7ec3605d14379be6f1f5de287ad6a1f1'
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: '24'
      lock_scope: all
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
