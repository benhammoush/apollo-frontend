name: Verify and deploy to prod
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA already delivered and accepted in dev
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify_release:
    name: Production checks
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-web.yml@43018f3d7ec3605d14379be6f1f5de287ad6a1f1
    with:
      automation_sha: '43018f3d7ec3605d14379be6f1f5de287ad6a1f1'
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: '24'
  deploy_production:
    name: Production delivery
    needs: verify_release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-web.yml@43018f3d7ec3605d14379be6f1f5de287ad6a1f1
    with:
      automation_sha: '43018f3d7ec3605d14379be6f1f5de287ad6a1f1'
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: '24'
      lock_scope: all
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_BYPASS: ${{ secrets.SMOKE_BYPASS }}
